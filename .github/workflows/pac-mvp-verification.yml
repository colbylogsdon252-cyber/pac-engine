name: PAC MVP Verification

on:
  push:
    branches:
      - protected-execution-replay-guard-v1
      - durable-execution-state-v1
      - external-effect-reconciliation-v1
      - downstream-adapter-contract-v1
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn requests

      - name: Proof token regression
        run: python -m unittest tests.test_proof_token_execution_binding -v

      - name: Temporal lifecycle regression
        run: python -m unittest tests.test_temporal_proof_lifecycle -v

      - name: Protected execution replay regression
        run: python -m unittest tests.test_protected_execution_replay_guard -v

      - name: Durable execution state regression
        run: python -m unittest tests.test_durable_execution_state -v

      - name: External effect reconciliation regression
        run: python -m unittest tests.test_external_effect_reconciliation -v

      - name: Downstream adapter contract regression
        run: python -m unittest tests.test_downstream_adapter_contract -v

      - name: Canonical CLI/API parity
        run: |
          python pac_api.py > /tmp/pac-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 15
          while time.time() < deadline:
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/docs", timeout=1)
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("PAC API failed to become ready")
          PY
          python scripts/pac_cli_api_parity_test.py
          git restore examples
          git diff --exit-code
