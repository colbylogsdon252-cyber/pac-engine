name: PAC MVP Verification

on:
  push:
    branches:
      - protected-execution-replay-guard-v1
      - durable-execution-state-v1
      - external-effect-reconciliation-v1
      - downstream-adapter-contract-v1
      - redispatch-authorization-recovery-v1
      - hardening-canonical-path-consolidation-v1
      - hardening-provenance-separation-v1
      - hardening-crash-race-state-v1
      - hardening-adversarial-boundaries-v1
      - hardening-secret-key-handling-v1
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn requests

      - name: Proof token regression
        run: python -m unittest tests.test_proof_token_execution_binding -v

      - name: Secret and key handling regression
        run: python -m unittest tests.test_secret_key_hardening -v

      - name: Temporal lifecycle regression
        run: python -m unittest tests.test_temporal_proof_lifecycle -v

      - name: Protected execution replay regression
        run: python -m unittest tests.test_protected_execution_replay_guard -v

      - name: Durable execution state regression
        run: python -m unittest tests.test_durable_execution_state -v

      - name: External effect reconciliation regression
        run: python -m unittest tests.test_external_effect_reconciliation -v

      - name: Downstream adapter contract regression
        run: python -m unittest tests.test_downstream_adapter_contract -v

      - name: Redispatch authorization recovery regression
        run: python -m unittest tests.test_redispatch_recovery -v

      - name: Crash race and state hardening regression
        run: python -m unittest tests.test_crash_race_state_hardening -v

      - name: Adversarial boundary hardening regression
        run: python -m unittest tests.test_adversarial_boundary_hardening -v

      - name: Active runtime boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = [
              "pac_engine_v1_interface.py",
              "pac_engine_v1_0_core.py",
              "pac_engine_v1_0_core_pre_hardening.py",
              "pac_engine_v1_1_core.py",
              "pac_engine_v1_1_core_frozen.py",
              "pac_engine_v1_attack_harness.py",
              "pac_engine_v1_attack_harness_wave2.py",
              "pac_engine_v1_attack_harness_wave3.py",
              "pac_engine_v1_attack_harness_wave3_frozen.py",
              "pac_engine_v1_interface_attack_tests.py",
              "pac_engine_v1_interface_tests.py",
              "pac_engine_v1_test_harness.py",
              "test_no_double_dict.py",
              ".pac_backups",
          ]
          present = [path for path in forbidden if Path(path).exists()]
          if present:
              raise SystemExit(f"legacy artifacts leaked into active root: {present}")
          if not Path("provenance/README.md").is_file():
              raise SystemExit("provenance boundary manifest missing")
          PY

      - name: Canonical CLI/API parity
        run: |
          python pac_api.py > /tmp/pac-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 15
          while time.time() < deadline:
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/docs", timeout=1)
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("PAC API failed to become ready")
          PY
          python scripts/pac_cli_api_parity_test.py
          git restore examples
          git diff --exit-code
